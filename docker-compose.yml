services:
  ninimenu:
    build:
      context: .
      args:
        NPM_REGISTRY: https://registry.npmmirror.com
        GOPROXY: https://goproxy.cn,direct
    image: ninimenu:latest
    container_name: ninimenu
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
      PORT: "8080"
      # 务必改掉默认密码，否则外网暴露后管理后台会被直接登录
      ADMIN_PASSWORD: "change-me-please"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./uploads_backup:/app/uploads_backup

